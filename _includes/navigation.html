<header class="bg-white shadow-md">
    <div class="container mx-auto px-6 py-4 flex justify-between items-center">
        <div class="text-xl font-bold text-blue-700">Pawan Kumar</div>
        <nav class="hidden md:flex space-x-4">
            {% for item in site.data.navigation %}
            <a href="{{ item.link }}" class="text-gray-700 hover:text-blue-700" {% if page.url==item.link %}style="color: red;" {% endif %}>
                {{ item.name }}
            </a>
            {% endfor %}
        </nav>
    </div>
</header>
